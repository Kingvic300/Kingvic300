name: Generate Snake Animation

on:
  schedule:
    - cron: '0 */12 * * *' # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snake_frame.py
      - scripts/theme.py
      - .github/workflows/snake.yml

permissions:
  contents: write # only to push the SVGs to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C2410C&color_dots=#EFEDEA,#FDD8BC,#FBB27A,#F2853A,#E8590C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFA45C&color_dots=#1C1F24,#4A2A14,#8A4515,#CC6417,#FF7A1A

      # svg-only runs as the runner user, so the files stay writable here.
      # Wraps the raw snake in the same terminal-style card as the rest of the README.
      - name: Frame snake SVGs
        run: python3 scripts/snake_frame.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
