name: Generate Snake Animation

on:
  schedule:
    - cron: '0 */12 * * *' # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snake_frame.py
      - scripts/theme.py
      - .github/workflows/snake.yml

permissions:
  contents: write # only to push the SVGs to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0284C7&color_dots=#E2E8F0,#BAE6FD,#7DD3FC,#38BDF8,#0284C7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#36BCF7&color_dots=#1E293B,#0C3A52,#13618A,#2394C9,#36BCF7

      # Wraps the raw snake in the same terminal-style card as the rest of the README.
      - name: Frame snake SVGs
        run: python3 scripts/snake_frame.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
